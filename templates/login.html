<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8f0e8"><title>Nadaan Bachcha · A little door</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 15%,#efd8d5 0,transparent 32%),radial-gradient(ellipse at 90% 85%,#dce4d4 0,transparent 28%),#f8f0e8;color:#463b39;font-family:Georgia,serif}.gate-card{width:min(100%,480px);padding:48px 30px;text-align:center;background:#fffaf4;border:1px solid #e8d8ce;box-shadow:0 18px 55px #694d3920;position:relative}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#bd7887}.gate-card h1{font-size:54px;font-weight:400;margin:14px 0}.gate-card h1 em{color:#bd7887}.gate-sub{font-size:19px;color:#887975}.flower{font-size:32px;color:#bd7887}.cat{font-size:94px;margin:15px}.label{display:block;font:700 12px Arial,sans-serif;color:#887975;margin-bottom:9px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1px solid #e8d8ce;border-radius:30px;padding:14px;font-size:16px}.row button{width:48px;border:0;border-radius:50%;background:#463b39;color:white;font-size:22px}.hint,.error{font:12px Arial,sans-serif;color:#887975}.error{color:#a13f4c;min-height:15px}.hand{font:23px cursive;color:#bd7887}
</style></head>
<body class="gate-body"><main class="gate-wrap"><div class="gate-card"><div class="tiny-flower">✿</div><p class="eyebrow">a little something, made with care</p><h1>Nadaan <em>Bachcha</em></h1><p class="gate-sub">A tiny world of flowers, sketches and words.</p><div class="cat" aria-hidden="true">🐈‍⬛ 💐</div><form id="gateForm"><label class="label" for="password">A little door, just for you</label><div class="row"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="•••" required><button type="submit" aria-label="Open the door">→</button></div><p class="hint">A small hint: Buddhu’s number.</p><p id="error" class="error" role="alert"></p></form><p class="hand">made with a little help from a cat ♡</p></div></main><script>
const form=document.getElementById('gateForm');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form))});const data=await r.json();if(data.ok)location.href=data.next;else document.getElementById('error').textContent=data.message||'Please try again.';}catch(_){document.getElementById('error').textContent='Could not open the door. Please try again.';}finally{b.disabled=false;}});
</script></body></html>
