<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f8f0e8">
    <title>Nadaan Bachcha</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #f8f0e8; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      fetch('./templates/site.html')
        .then((response) => {
          if (!response.ok) throw new Error('Template not found');
          return response.text();
        })
        .then((html) => {
          document.getElementById('app').innerHTML = html;
        })
        .catch((error) => {
          document.getElementById('app').innerHTML = '<main style="padding:2rem;font-family:sans-serif;color:#463b39;">Unable to load the site template.</main>';
          console.error(error);
        });
    </script>
  </body>
</html>
